apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        node-role/apps: "true"          # app pods can target these nodes
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]             # our CI builds amd64 images
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"] # prefers Spot (cheapest), falls back to on-demand
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]       # compute / general / memory families
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]                 # 6th gen and newer (c6i, m7i, r6a...)
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge"]   # avoid huge instances in dev
      expireAfter: 336h                 # replace every node after 14 days (fresh AMI, patched)

  # Hard cost cap: Karpenter will never run more than this in total
  limits:
    cpu: "16"
    memory: 64Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized   # remove/replace wasteful nodes
    consolidateAfter: 1m
    budgets:
      - nodes: "20%"                    # never disrupt more than 20% of nodes at once
