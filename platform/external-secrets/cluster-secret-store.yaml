# Tells External Secrets HOW to reach AWS Secrets Manager.
# Credentials come from the controller's Pod Identity (no keys here).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
  # Only the newstart namespace may use this store.
  conditions:
    - namespaces: ["newstart"]