# Master (admin) credentials: used ONLY by the one-off DB bootstrap Job.
# Mapped to the standard PG* variables that psql reads automatically.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-master
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  dataFrom:
    - extract: { key: k8s-portfolio/dev/db/master }
  target:
    name: rds-master
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PGHOST: "{{ .host }}"
        PGPORT: "{{ .port }}"
        PGUSER: "{{ .username }}"
        PGPASSWORD: "{{ .password }}"
        PGDATABASE: postgres
