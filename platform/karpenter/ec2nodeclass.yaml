apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # IAM role for the nodes (created by Terraform's karpenter module)
  role: k8s-portfolio-dev-karpenter-node

  # Amazon Linux 2023 EKS-optimized AMI. "@latest" is fine for dev;
  # in prod we pin a version (e.g. al2023@v2026xxxx) so upgrades are deliberate.
  amiSelectorTerms:
    - alias: al2023@latest

  # Find subnets and security group by tag, never by hard-coded IDs.
  # Terraform put these tags on the PRIVATE subnets and the node security group.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: k8s-portfolio-dev
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: k8s-portfolio-dev

  # IMDSv2 only, hop limit 1: pods cannot reach the node's instance metadata
  # (and steal the node's IAM credentials). Pods get AWS access via Pod Identity instead.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    project: k8s-portfolio
    environment: dev
    managed-by: karpenter
