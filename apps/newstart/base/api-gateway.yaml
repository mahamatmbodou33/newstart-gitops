apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: newstart
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2                                  # the front door: never run just one
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: api-gateway }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: newstart
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role/apps: "true"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: api-gateway }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: newstart/api-gateway
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: newstart-config }   # the 4 *_SERVICE_URL values
          env:
            - { name: SERVICE_NAME, value: api-gateway }
            - { name: PORT, value: "8080" }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: newstart
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    alb.ingress.kubernetes.io/healthcheck-path: /health   # what the ALB pings for this target group
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Keep at least 1 gateway pod running during voluntary disruptions
# (Karpenter consolidation, node upgrades, Spot rebalancing).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: api-gateway }
