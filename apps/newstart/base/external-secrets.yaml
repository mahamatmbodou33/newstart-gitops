# Each ExternalSecret = "read this AWS secret, build this Kubernetes Secret".
# Refreshes hourly, so a rotated password in AWS reaches the pod automatically.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-service-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  dataFrom:
    - extract:
        key: k8s-portfolio/dev/db/user-service     # JSON: username, password, dbname, host, port
  target:
    name: user-service-db                          # the Kubernetes Secret it creates
    creationPolicy: Owner                          # delete the ExternalSecret -> Secret is deleted too
    template:
      engineVersion: v2
      data:
        # The one variable the app reads. verify-full = encrypted AND the server
        # certificate is checked against the RDS CA bundle baked into the image.
        DATABASE_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=verify-full"
        # Used only by the DB bootstrap Job to create this user and database.
        DB_USER: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
        DB_NAME: "{{ .dbname }}"
---
