apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"        # after the operator (wave 0)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/mahamatmbodou33/newstart-gitops.git
    targetRevision: main
    path: platform/external-secrets          # a folder of plain YAML, not a chart
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - SkipDryRunOnMissingResource=true     # CRD may not exist yet on first sync
    retry:                                   # ...so keep retrying until it does
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }